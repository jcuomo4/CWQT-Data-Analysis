name: Update CWQT map

on:
  schedule:
    # Every day at 11:17 UTC (7:17 am in New York during the season).
    # Daily runs mean new results show up the morning after they're entered.
    - cron: "17 11 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual updates

permissions:
  contents: write   # to commit status.json (also keeps the schedule from being paused)
  pages: write      # to publish the site
  id-token: write   # required by the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the sheet and build the map and charts
        env:
          CWQT_SHEET_ID: ${{ secrets.CWQT_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python cwqt_visualize.py --out build

      - name: Choose what gets published
        # Only these files go on the public website. The workbook, CSV tables and
        # data-quality report stay private.
        run: |
          mkdir -p site
          cp build/cwqt_map.html site/index.html
          cp build/cwqt_map.html site/cwqt_map.html
          cp build/*.png build/site_timeseries.pdf site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Record new data / keep the schedule active
        # GitHub pauses scheduled workflows after 60 days without a commit.
        # This commits status.json whenever new data arrives, and an empty
        # "keep-alive" commit if 45 days pass without one (e.g. off-season).
        run: |
          cp build/status.json status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if ! git diff --cached --quiet; then
            git commit -m "Data updated: $(python -c "import json;d=json.load(open('status.json'));print(d['data_through'], d['samples'], 'samples')")"
          elif [ "$age_days" -ge 45 ]; then
            git commit --allow-empty -m "Keep scheduled update active"
          fi
          git push
